version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      # Host port 5544 (not the default 5432) to avoid colliding with any
      # PostgreSQL already running locally on the default port.
      - '5544:5432'
    volumes:
      - pulse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulse -d pulse']
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pulse:pulse@db:5432/pulse
      NODE_ENV: production
      NUXT_PUBLIC_APP_URL: http://localhost:3000
      WORKER_CONCURRENCY: '20'
      WORKER_POLL_INTERVAL_MS: '1000'
      WORKER_LEASE_SECONDS: '60'
      WORKER_SHUTDOWN_GRACE_MS: '60000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pulse_db_data:
